<circle cx="857" cy="61" r="16.5" fill="none" stroke="#5EEAD4" stroke-width="3" stroke-dasharray="7.5 6"/><circle cx="857" cy="61" r="3" fill="#5EEAD4"/>
<text x="830" y="124" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#E6FFFB">DevOps &amp; Tooling</text>
<text x="830" y="156" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="14" font-weight="500" fill="#8FC7C0">Docker containers, Jenkins and</text>
<text x="830" y="177" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="14" font-weight="500" fill="#8FC7C0">GitHub Actions CI/CD pipelines,</text>
<text x="830" y="198" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="14" font-weight="500" fill="#8FC7C0">Grafana + Prometheus monitoring</text>
