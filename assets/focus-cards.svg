<text x="62" y="124" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#E6FFFB">Flutter Mobile Apps</text>
<text x="62" y="156" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="14" font-weight="500" fill="#8FC7C0">Cross-platform Android and iOS</text>
<text x="62" y="177" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="14" font-weight="500" fill="#8FC7C0">apps in Flutter &amp; Dart, with</text>
<text x="62" y="198" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="14" font-weight="500" fill="#8FC7C0">Firebase, clean state management</text>
<text x="62" y="219" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="14" font-weight="500" fill="#8FC7C0">and reusable widgets.</text>
<rect x="420" y="4" width="360" height="249" rx="16" fill="url(#cardG)" stroke="#134E4A" stroke-width="1"/>
<rect x="446" y="34" width="54" height="54" rx="13" fill="#14B8A6" fill-opacity="0.12" stroke="#14B8A6" stroke-opacity="0.4"/>
<rect x="455.5" y="47" width="35" height="28" rx="5" fill="none" stroke="#14B8A6" stroke-width="2.4"/><line x1="455.5" y1="56" x2="490.5" y2="56" stroke="#14B8A6" stroke-width="2.4"/>
<text x="446" y="124" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#E6FFFB">Full-Stack Web</text>
<text x="446" y="156" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="14" font-weight="500" fill="#8FC7C0">React, Next.js and Angular front</text>
<text x="446" y="177" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="14" font-weight="500" fill="#8FC7C0">ends on top of NestJS, Express,</text>
<text x="446" y="198" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="14" font-weight="500" fill="#8FC7C0">Spring Boot and Symfony APIs,</text>
<text x="446" y="219" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="14" font-weight="500" fill="#8FC7C0">backed by SQL and NoSQL data.</text>
